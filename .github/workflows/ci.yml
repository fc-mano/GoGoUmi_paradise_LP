name: CI / Automated Quality & Regression Tests

on:
  push:
    branches: [ main, "refactor/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Syntax & Schema Integration Tests
        run: |
          node --test tests/test_suite.js\n