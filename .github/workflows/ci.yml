name: CI / Automated Quality & Regression Tests

on:
  push:
    branches: [ main, "refactor/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run LP Syntax & Schema Integration Tests
        run: |
          node --test tests/test_suite.js

      - name: Run WebGames Automated Tests
        run: |
          node games/config.test.js
          node games/common/coupon-manager.test.js
          node games/apps/watermelon-game/script.test.js
          node games/apps/bbq-game/script.test.js
          node games/apps/acai-game/script.test.js\n